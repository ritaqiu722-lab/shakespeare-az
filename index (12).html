<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>莎士比亞單字 A–Z</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;600&display=swap">
<style>
  /* Layout: one stage card (picture, blank letter slots, pronounce, quote, spell) under an A–Z strip. */
  :root{
    --display:'IM Fell English',Georgia,'Noto Serif TC','PingFang TC','Songti TC',serif;
    --body:'Inter','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --bg:#EDF0F4; --panel:#F8F9FB; --paper:#E3E8EF; --ink:#16202D; --muted:#566275; --line:#C6CEDA;
    --accent:#9E1F33; --on-accent:#FFFFFF; --gold:#C79A2B; --leaf:#4C7A5A; --hl:#F1D78C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1520; --panel:#172131; --paper:#223048; --ink:#E7ECF3; --muted:#9AA7BA; --line:#2B3850;
      --accent:#E0566A; --on-accent:#14070B; --gold:#E3B341; --leaf:#6FB088; --hl:#6A5218;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1520; --panel:#172131; --paper:#223048; --ink:#E7ECF3; --muted:#9AA7BA; --line:#2B3850;
    --accent:#E0566A; --on-accent:#14070B; --gold:#E3B341; --leaf:#6FB088; --hl:#6A5218;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.6;
    padding-block:24px 40px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
  }
  main{max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
  h1{font-family:var(--display); font-weight:400; font-size:clamp(1.9rem,6vw,2.5rem); line-height:1.15; margin:0; text-wrap:balance}
  .lede{margin:4px 0 0; color:var(--muted); font-size:.95rem}

  #abc{display:grid; grid-template-columns:repeat(auto-fill,minmax(40px,1fr)); gap:6px}
  #abc button{
    position:relative; min-height:40px; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:8px; font-family:var(--display); font-size:1.15rem; cursor:pointer; padding:0;
  }
  #abc button[aria-current="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
  #abc button.done::after{content:""; position:absolute; bottom:4px; left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--gold)}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:20px; display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .art{position:relative; width:100%; max-width:280px; aspect-ratio:1/1}
  .art .letter{position:absolute; top:-6px; left:-4px; font-family:var(--display); font-size:3.4rem; line-height:1; color:var(--accent); opacity:.9}
  .art svg{width:100%; height:100%; display:block}
  .art svg .s{fill:none; stroke:var(--ink); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
  .art svg .fp{fill:var(--paper)}
  .art svg .fa{fill:var(--accent)}
  .art svg .fg{fill:var(--gold)}
  .art svg .fl{fill:var(--leaf)}
  .art svg .fi{fill:var(--ink); stroke:none}
  .art svg .n{stroke:none}
  .art svg .tx{fill:var(--ink); stroke:none; font-family:var(--display)}
  .art svg .txa{fill:var(--on-accent); stroke:none; font-family:var(--display)}

  .slots{display:flex; justify-content:center; gap:6px; width:100%; min-height:48px}
  .slot{
    flex:1 1 0; min-width:0; max-width:34px; height:46px; border-bottom:3px solid var(--ink);
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:2px;
    font-family:var(--display); font-size:clamp(1.1rem,5.4vw,2rem); line-height:1.1; color:var(--ink);
  }
  .slot.on{border-bottom-color:var(--accent); color:var(--accent)}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    min-height:48px; padding:0 24px; width:100%; max-width:320px;
    border:1.5px solid var(--ink); background:transparent; color:var(--ink);
    border-radius:10px; font:600 1rem var(--body); cursor:pointer;
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn svg{width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

  .quote{
    margin:0; width:100%; min-height:9.5rem; padding:6px 4px; text-align:center;
    display:flex; flex-direction:column; justify-content:center; gap:10px;
  }
  .quote .en{font-family:var(--display); font-style:italic; font-size:clamp(1.25rem,4.6vw,1.6rem); line-height:1.45; text-wrap:balance}
  .quote mark{background:var(--hl); color:var(--ink); padding:0 .12em; border-radius:3px}
  .quote .zh{color:var(--ink); font-size:1rem}
  .quote .src{color:var(--muted); font-size:.85rem}
  .quote.empty{color:var(--muted); font-size:.95rem}
  .quote.show{animation:rise .35s ease-out}
  @keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){.quote.show{animation:none}}

  .hint{margin:0; color:var(--muted); font-size:.88rem; text-align:center; min-height:1.4em}

  .pager{display:flex; justify-content:space-between; gap:12px}
  .pager .btn{max-width:none; width:auto; flex:1 1 0}
  .foot{margin:0; color:var(--muted); font-size:.8rem; text-align:center}
</style>

</head>
<body>
<main>
  <header>
    <h1>莎士比亞單字 A–Z</h1>
    <p class="lede">看圖、聽發音、讀金句,最後自己拼出來。</p>
  </header>

  <nav id="abc" aria-label="選擇字母"></nav>

  <section class="card" aria-live="polite">
    <div class="art"><span class="letter" id="letter">A</span><div id="art"></div></div>
    <div class="slots" id="slots"></div>

    <button class="btn primary" id="say" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      念出單字
    </button>

    <blockquote class="quote empty" id="quote">按下「念出單字」,這個字的金句會出現在這裡。</blockquote>

    <button class="btn" id="spell" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18 12 5l7 13M8 13h8"/></svg>
      拼出單字
    </button>
    <p class="hint" id="hint"></p>
  </section>

  <div class="pager">
    <button class="btn" id="prev" type="button">上一個</button>
    <button class="btn" id="next" type="button">下一個</button>
  </div>
  <p class="foot">引文憑記憶整理,正式引用前請對照原文。</p>
</main>

const LETTER_NAME = {a:'ay',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'el',m:'em',n:'en',o:'oh',p:'pee',q:'cue',r:'ar',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zed'};

const $ = id => document.getElementById(id);
const abc = $('abc'), letterEl = $('letter'), artEl = $('art'), slotsEl = $('slots');
const sayBtn = $('say'), spellBtn = $('spell'), quoteEl = $('quote'), hintEl = $('hint');
const hasSpeech = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';

let idx = 0, token = 0, heard = false;
const done = new Set();

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function pickVoice(){
  if (!hasSpeech) return null;
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}

function speak(text, rate){
  return new Promise(resolve => {
    if (!hasSpeech) { resolve(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB';
    const v = pickVoice(); if (v) u.voice = v;
    u.rate = rate || 0.85;
    let finished = false, timer;
    const fin = () => { if (!finished) { finished = true; clearTimeout(timer); resolve(); } };
    u.onend = fin; u.onerror = fin;
    timer = setTimeout(fin, 5000);
    try { speechSynthesis.speak(u); } catch (e) { fin(); }
  });
}

function stopSpeech(){ if (hasSpeech) { try { speechSynthesis.cancel(); } catch (e) {} } }

function buildStrip(){
  abc.innerHTML = WORDS.map((w, i) => `<button type="button" data-i="${i}" aria-label="字母 ${w.l}">${w.l}</button>`).join('');
  abc.addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) go(+b.dataset.i);
  });
}

function setHint(t){ hintEl.textContent = t; }

function render(){
  const w = WORDS[idx];
  token++; stopSpeech(); heard = false;
  letterEl.textContent = w.l;
  artEl.innerHTML = `<svg viewBox="0 0 200 200" role="img" aria-label="${w.w} 的插圖">${w.art}</svg>`;
  slotsEl.innerHTML = [...w.w].map(() => '<span class="slot"></span>').join('');
  quoteEl.className = 'quote empty';
  quoteEl.textContent = '按下「念出單字」,這個字的金句會出現在這裡。';
  spellBtn.disabled = true;
  sayBtn.disabled = false;
  setHint(hasSpeech ? '先按「念出單字」,聽完後就能拼字。' : '這個瀏覽器沒有語音功能,仍可閱讀金句與拼字。');
  [...abc.children].forEach((b, i) => {
    b.setAttribute('aria-current', i === idx ? 'true' : 'false');
    b.classList.toggle('done', done.has(i));
  });
}

function showQuote(){
  const w = WORDS[idx];
  const re = new RegExp('\\b' + w.w + '\\b', 'gi');
  const en = w.q.split('\n').map(line => esc(line).replace(re, m => `<mark>${m}</mark>`)).join('<br>');
  quoteEl.className = 'quote show';
  quoteEl.innerHTML = `<div class="en">${en}</div><div class="zh">${esc(w.zh)}</div><div class="src">${esc(w.src)}</div>`;
}

async function onSay(){
  const my = ++token; stopSpeech();
  showQuote();
  sayBtn.disabled = true;
  setHint('播放中……');
  await speak(WORDS[idx].say, 0.8);
  if (my !== token) return;
  heard = true;
  sayBtn.disabled = false;
  spellBtn.disabled = false;
  setHint('聽完了?按下「拼出單字」,一個字母一個字母念出來。');
}

async function onSpell(){
  if (!heard) return;
  const my = ++token; stopSpeech();
  const w = WORDS[idx];
  const slots = [...slotsEl.children];
  slots.forEach(s => { s.textContent = ''; s.classList.remove('on'); });
  sayBtn.disabled = true; spellBtn.disabled = true;
  setHint('拼字中……');
  for (let i = 0; i < w.w.length; i++) {
    slots[i].classList.add('on');
    await speak(LETTER_NAME[w.w[i].toLowerCase()] || w.w[i], 0.8);
    if (my !== token) return;
    slots[i].textContent = w.w[i];
    slots[i].classList.remove('on');
    await sleep(120);
    if (my !== token) return;
  }
  await sleep(250);
  await speak(w.say, 0.8);
  if (my !== token) return;
  done.add(idx);
  abc.children[idx].classList.add('done');
  sayBtn.disabled = false; spellBtn.disabled = false;
  setHint(`拼完了:${w.w}。可以再按一次,或換下一個字。`);
}

function go(i){
  idx = (i + WORDS.length) % WORDS.length;
  render();
  try { const h = '#' + WORDS[idx].l.toLowerCase(); if (location.hash !== h) location.hash = h; } catch (e) {}
}

function fromHash(){
  const m = (location.hash || '').replace('#', '').toUpperCase();
  const i = WORDS.findIndex(w => w.l === m);
  if (i >= 0 && i !== idx) { idx = i; render(); }
}

sayBtn.addEventListener('click', onSay);
spellBtn.addEventListener('click', onSpell);
$('prev').addEventListener('click', () => go(idx - 1));
$('next').addEventListener('click', () => go(idx + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(idx - 1);
  if (e.key === 'ArrowRight') go(idx + 1);
});
window.addEventListener('hashchange', fromHash);
if (hasSpeech) speechSynthesis.onvoiceschanged = () => {};

buildStrip();
const startLetter = (location.hash || '').replace('#', '').toUpperCase();
const startIdx = WORDS.findIndex(w => w.l === startLetter);
idx = startIdx >= 0 ? startIdx : 0;
render();
</script>
